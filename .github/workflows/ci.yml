name: CloudGuard CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/app

      - name: Run Pytest with Moto (Mock AWS)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-automated-github-actions-tests"
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

  iac-security-scan:
    name: Terraform Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov Static Code Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true # Set to false to strictly block builds on security warnings
          output_format: cli

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: cloudguard-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: cloudguard-frontend:latest
